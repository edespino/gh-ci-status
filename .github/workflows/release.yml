# SPDX-License-Identifier: Apache-2.0
# Publishes prebuilt binaries to a GitHub release when a v* tag is pushed, so
# 'gh extension install edespino/gh-ci-status' works. Tags with a "-" (for example
# v1.0.0-rc.1) become prereleases.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          go_build_options: ./cmd/gh-ci-status
          generate_attestations: true
