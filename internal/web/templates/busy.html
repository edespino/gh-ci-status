{{define "busy"}}
<div id="busy" hidden><div class="spin"></div><span id="busy-text">Reading GitHub…</span></div>
<style>
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:14px;z-index:10;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#busy[hidden]{display:none}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(function () {
  // Same-site actions wait on GitHub before the next page arrives; show that
  // something is happening and stop double submits. A form with data-confirm
  // asks first and does nothing when the answer is no, unless Settings turned
  // the questions off (data-skip-confirm on the body).
  function busy(text) {
    document.getElementById("busy-text").textContent = text || "Reading GitHub…";
    document.getElementById("busy").hidden = false;
  }
  document.addEventListener("submit", function (e) {
    var ask = e.target.dataset.confirm;
    if (ask && !document.body.hasAttribute("data-skip-confirm") && !window.confirm(ask)) {
      e.preventDefault();
      return;
    }
    busy(e.target.dataset.busy);
    Array.prototype.forEach.call(e.target.querySelectorAll("button"), function (b) { b.disabled = true; });
  }, true);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-busy]");
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
    busy(a.dataset.busy);
  });
  // Coming back with the Back button restores the page from cache: clear it.
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) {
      document.getElementById("busy").hidden = true;
      Array.prototype.forEach.call(document.querySelectorAll("button"), function (b) { b.disabled = false; });
    }
  });
})();
</script>
{{end}}
